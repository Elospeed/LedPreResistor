# Automatischer Windows-Build für LedPreResistor.
#
# Was passiert wann:
# - Jeder Pull Request und jeder Push auf main baut die EXE auf einem
#   Windows-Rechner von GitHub und die Linux-Version (tar.gz) auf einem
#   Linux-Rechner. Fehler im Quelltext fallen so sofort auf.
# - Die EXE landet nur als Workflow-Artefakt beim Build-Lauf (privat, nur mit
#   GitHub-Login, 14 Tage). Testversionen werden NICHT als Vor-Release
#   veröffentlicht, sondern gehen als ZIP mit Anleitung privat an die Tester.
# - Sollte es doch einmal Vor-Releases mit Tag "test-..." geben, löscht sie der
#   Job "aufraeumen" bei jedem Push auf main und beim Schliessen eines PRs.
#
# Details: docs/TESTVERSIONEN.md

name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# Schreibrecht auf "contents" braucht es nur, um alte Vor-Releases zu löschen.
permissions:
  contents: write

# Pro Branch bzw. PR immer nur ein Lauf; ein neuer Push bricht den alten Lauf ab.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Lazarus-Version für den Build (FPC 3.2.2 ist dabei)
  LAZARUS_VERSION: "3.8"

jobs:
  build:
    # Beim Schliessen eines PRs wird nicht gebaut, nur aufgeräumt (Job "aufraeumen")
    if: github.event.action != 'closed'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Lazarus installieren
        # Fremde Action: auf einen festen Commit gepinnt (= Tag v3.4.1), nicht auf
        # "v3". Ein Tag kann der Autor jederzeit verschieben, und dieser Job läuft
        # mit Schreibrecht auf das Repository.
        uses: gcarreno/setup-lazarus@3ee9d77e0c771b37c1069f218cb68bd5ce7c30fe # v3.4.1
        with:
          lazarus-version: ${{ env.LAZARUS_VERSION }}
          with-cache: false

      - name: EXE bauen
        run: |
          set -e
          # -B = alle Units neu übersetzen (kein alter Stand aus einem Cache)
          lazbuild -B --os=win64 --cpu=x86_64 --ws=win32 src/LedPreResistor.lpi
          # LED-Info muss als Ressource in der EXE stecken
          if ! grep -q "<title>Die Leuchtdiode</title>" bin/LedPreResistor.exe; then
            echo "::error::LED-Info (Ressource LEDINFO) fehlt in der EXE"
            exit 1
          fi
          # englische LED-Info und englische Übersetzung ebenso
          if ! grep -q "<title>The LED</title>" bin/LedPreResistor.exe; then
            echo "::error::Englische LED-Info (Ressource LEDINFO_EN) fehlt in der EXE"
            exit 1
          fi
          if ! grep -q 'msgstr "Supply voltage"' bin/LedPreResistor.exe; then
            echo "::error::Englische Übersetzung (Ressource LANG_EN) fehlt in der EXE"
            exit 1
          fi

      - name: Tests der Rechenlogik bauen und ausführen
        run: |
          set -e
          # FPCUnit-Testprogramm (Konsole). Exitcode 1 bei einem Fehler -> Build rot.
          lazbuild -B --os=win64 --cpu=x86_64 tests/LedPreResistorTests.lpi
          ./bin/LedPreResistorTests.exe

      - name: EXE einsammeln, verkleinern und Prüfsumme bilden
        run: |
          set -e
          mkdir -p ausgabe
          cp bin/LedPreResistor.exe ausgabe/

          # Debug-Infos entfernen. strip.exe liegt bei FPC dabei.
          STRIP=$(find /c/lazarus -iname strip.exe 2>/dev/null | head -n 1 || true)
          if [ -z "$STRIP" ]; then STRIP=$(command -v strip || true); fi
          if [ -n "$STRIP" ]; then
            echo "strip: $STRIP"
            "$STRIP" ausgabe/*.exe
          else
            echo "::warning::strip.exe nicht gefunden, EXE bleibt gross"
          fi

          cd ausgabe
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: EXE als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: LedPreResistor-Win64-${{ github.sha }}
          path: ausgabe/
          retention-days: 14

  linux:
    # Linux-Version (GTK2): gleicher Quelltext, nativ gebaut. Ergebnis nur als
    # Workflow-Artefakt (tar.gz), keine Vor-Releases.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Lazarus installieren
        # gleicher gepinnter Commit wie im Windows-Job (= Tag v3.4.1)
        uses: gcarreno/setup-lazarus@3ee9d77e0c771b37c1069f218cb68bd5ce7c30fe # v3.4.1
        with:
          lazarus-version: ${{ env.LAZARUS_VERSION }}
          with-cache: false

      - name: Programm bauen
        run: |
          set -e
          lazbuild -B --ws=gtk2 src/LedPreResistor.lpi
          # LED-Info und Übersetzung müssen als Ressource im Programm stecken
          grep -q "<title>Die Leuchtdiode</title>" bin/LedPreResistor || { echo "::error::LED-Info fehlt im Linux-Programm"; exit 1; }
          grep -q "<title>The LED</title>" bin/LedPreResistor || { echo "::error::Englische LED-Info fehlt im Linux-Programm"; exit 1; }
          grep -q 'msgstr "Supply voltage"' bin/LedPreResistor || { echo "::error::Englische Übersetzung fehlt im Linux-Programm"; exit 1; }
          strip bin/LedPreResistor
          ls -l bin/LedPreResistor

      - name: Tests der Rechenlogik unter Linux
        run: |
          set -e
          lazbuild -B tests/LedPreResistorTests.lpi
          ./bin/LedPreResistorTests

      - name: Startet das Programm? (Xvfb, Bildschirmfoto)
        run: |
          set -e
          sudo apt-get install -y -q xvfb imagemagick xdotool > /dev/null
          mkdir -p ausgabe
          # 5 s laufen lassen. Fehler beim Start: Programm beendet sich, oder LCL
          # zeigt eine Fehlermeldung mit dem Titel "Elospeed LedPreResistor"
          # (das Hauptfenster heisst "LedPreResistor · Elospeed <Version>").
          xvfb-run -a -s "-screen 0 1280x1000x24" bash -c '
            ./bin/LedPreResistor & PID=$!
            sleep 5
            import -window root ausgabe/Bildschirm-Linux.png
            kill -0 $PID || { echo "::error::Programm ist beim Start beendet"; exit 1; }
            if xdotool search --name "^Elospeed LedPreResistor$" > /dev/null; then
              echo "::error::Fehlermeldung beim Start (siehe Bildschirm-Linux.png)"; kill $PID; exit 1
            fi
            xdotool search --onlyvisible --name "LedPreResistor · Elospeed" > /dev/null || { echo "::error::Hauptfenster fehlt"; kill $PID; exit 1; }
            kill $PID'

      - name: Paket packen
        run: |
          set -e
          VERSION=$(sed -n "s/^ *APP_VER *= *'\(.*\)';.*/\1/p" src/uMain.pas | head -n 1 | tr -d '\r')
          linux/pakete-bauen.sh "$VERSION" ausgabe
          cd ausgabe
          sha256sum *.tar.gz > SHA256SUMS-Linux.txt
          cat SHA256SUMS-Linux.txt

      - name: Paket als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: LedPreResistor-Linux-${{ github.sha }}
          path: ausgabe/
          retention-days: 14

  aufraeumen:
    # Alte Test-Vor-Releases (Tags "test-...") entfernen: bei jedem Push auf main
    # und nach dem Schliessen oder Mergen eines PRs. Offizielle Releases (v2.0 usw.)
    # sind keine Vor-Releases und beginnen nicht mit "test-", bleiben also unberührt.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Test-Vor-Releases löschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Nur Releases, die Vor-Release sind UND deren Tag mit "test-" beginnt
          gh release list --repo "$REPO" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("test-"))) | .tagName' |
          while read -r TAG; do
            echo "Lösche $TAG"
            gh release delete "$TAG" --cleanup-tag --yes --repo "$REPO" || true
          done
