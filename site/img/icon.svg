<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffde0"/>
      <stop offset="0.18" stop-color="#f6e65a"/>
      <stop offset="0.55" stop-color="#e9d21c"/>
      <stop offset="0.85" stop-color="#d9c010"/>
      <stop offset="1" stop-color="#fff6a8"/>
    </linearGradient>
    <linearGradient id="flange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff9c0"/>
      <stop offset="0.5" stop-color="#ecd83a"/>
      <stop offset="1" stop-color="#cfb20a"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5d63"/>
      <stop offset="0.45" stop-color="#e9ecef"/>
      <stop offset="1" stop-color="#7d8188"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fff35a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff35a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(120 116) rotate(-32) scale(1.05) translate(-128 -128)">
    <!-- Beine -->
    <rect x="105" y="150" width="9" height="108" rx="3" fill="url(#leg)"/>
    <rect x="142" y="150" width="9" height="104" rx="3" fill="url(#leg)"/>
    <!-- Gehäuse: Zylinder mit Kuppel -->
    <path d="M82 150 V60 A46 46 0 0 1 174 60 V150 Z" fill="url(#body)" stroke="#b89c00" stroke-width="2"/>
    <!-- Kragen -->
    <rect x="76" y="144" width="104" height="16" rx="3" fill="url(#flange)" stroke="#b89c00" stroke-width="2"/>
    <!-- Innenleben: Pfosten und Reflektor (dunkel, durch das Gehäuse sichtbar) -->
    <rect x="106" y="98" width="9" height="48" fill="#8a7400" opacity="0.75"/>
    <path d="M136 92 h22 l-6 18 h-10 v36 h-9 z" fill="#5c4a00" opacity="0.8"/>
    <path d="M113 98 Q128 84 140 94" stroke="#7a6400" stroke-width="3" fill="none" opacity="0.7"/>
    <ellipse cx="128" cy="78" rx="34" ry="30" fill="url(#glow)"/>
    <!-- Glanzlicht -->
    <ellipse cx="104" cy="50" rx="12" ry="19" fill="#fffef4" opacity="0.9" transform="rotate(-18 104 50)"/>
    <rect x="90" y="72" width="7" height="66" rx="3.5" fill="#fffde0" opacity="0.55"/>
  </g>
</svg>
